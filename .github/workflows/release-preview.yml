name: Publish installer and portable preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-portable-preview-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Read release contract
        id: contract
        shell: powershell
        run: |
          $contract = Get-Content packaging/preview-release.json -Raw | ConvertFrom-Json
          if ($contract.schemaVersion -ne 1 -or
              $contract.releaseVersion -notmatch '^\d+\.\d+\.\d+-preview\.\d+$' -or
              $contract.tag -cne "v$($contract.releaseVersion)" -or
              -not $contract.prerelease) {
            throw 'Invalid preview release contract.'
          }
          "version=$($contract.releaseVersion)" >> $env:GITHUB_OUTPUT
          "tag=$($contract.tag)" >> $env:GITHUB_OUTPUT
      - name: Reject an existing release tag
        shell: powershell
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $escapedTag = [Uri]::EscapeDataString('${{ steps.contract.outputs.tag }}')
          $uri = 'https://api.github.com/repos/${{ github.repository }}/releases/tags/' + $escapedTag
          try {
            [void](Invoke-RestMethod -Method Get -Uri $uri -Headers $headers)
            throw "Release tag already exists: ${{ steps.contract.outputs.tag }}"
          }
          catch {
            $response = $_.Exception.Response
            if ($null -eq $response -or [int]$response.StatusCode -ne 404) {
              throw
            }
          }
      - name: Build installer and portable preview
        shell: powershell
        run: >-
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File packaging/build-preview-release.ps1
          -OutputDirectory preview-release
      - name: Verify installer and portable preview
        shell: powershell
        run: >-
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File packaging/verify-preview-release.ps1
          -OutputDirectory preview-release
          -SkipPortableRuntimeSmoke
      - name: Publish GitHub prerelease
        shell: powershell
        run: |
          gh release create '${{ steps.contract.outputs.tag }}' `
            preview-release/* `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title 'ezy Image Viewer Installer + Portable Preview ${{ steps.contract.outputs.version }}' `
            --notes-file docs/preview-release-notes.md `
            --prerelease
