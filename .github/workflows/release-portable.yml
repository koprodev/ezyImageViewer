name: Publish portable preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-preview-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Read release contract
        id: contract
        shell: powershell
        run: |
          $contract = Get-Content packaging/portable-release.json -Raw | ConvertFrom-Json
          if ($contract.schemaVersion -ne 1 -or
              $contract.version -notmatch '^\d+\.\d+\.\d+-portable\.\d+$' -or
              $contract.tag -cne "v$($contract.version)" -or
              -not $contract.prerelease) {
            throw 'Invalid portable release contract.'
          }
          "version=$($contract.version)" >> $env:GITHUB_OUTPUT
          "tag=$($contract.tag)" >> $env:GITHUB_OUTPUT
      - name: Check for existing release
        id: existing
        shell: powershell
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $escapedTag = [Uri]::EscapeDataString('${{ steps.contract.outputs.tag }}')
          $uri = 'https://api.github.com/repos/${{ github.repository }}/releases/tags/' + $escapedTag
          try {
            [void](Invoke-RestMethod -Method Get -Uri $uri -Headers $headers)
            'exists=true' >> $env:GITHUB_OUTPUT
          }
          catch {
            $response = $_.Exception.Response
            if ($null -ne $response -and [int]$response.StatusCode -eq 404) {
              'exists=false' >> $env:GITHUB_OUTPUT
            }
            else {
              throw
            }
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: steps.existing.outputs.exists != 'true'
        with:
          global-json-file: global.json
      - name: Build portable preview
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: >-
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File packaging/build-portable-release.ps1
          -Version '${{ steps.contract.outputs.version }}'
          -OutputDirectory portable-release
      - name: Verify portable preview
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: >-
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File packaging/verify-portable-release.ps1
          -Version '${{ steps.contract.outputs.version }}'
          -OutputDirectory portable-release
      - name: Publish GitHub prerelease
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: |
          gh release create '${{ steps.contract.outputs.tag }}' `
            portable-release/*.zip `
            portable-release/SHA256SUMS.txt `
            portable-release/portable-release-manifest.json `
            --repo '${{ github.repository }}' `
            --target $env:RELEASE_SHA `
            --title 'ezy Image Viewer Basic Portable Preview ${{ steps.contract.outputs.version }}' `
            --notes-file docs/portable-release-notes.md `
            --prerelease
