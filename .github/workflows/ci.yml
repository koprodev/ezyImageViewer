# 공개 소스 CI. Store 제출용 MSIX는 검증만 하며 GitHub에 배포하지 않음.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: >-
          dotnet restore EzyImageViewer.slnx --locked-mode
          -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1903%3BNU1904
      - name: Build
        run: dotnet build EzyImageViewer.slnx -c Release --no-restore
      - name: Test
        run: >-
          dotnet test EzyImageViewer.Tests/EzyImageViewer.Tests.csproj
          -c Release --no-build --logger trx --results-directory TestResults
      - name: Verify public source snapshot contract
        shell: powershell
        run: |
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/test-public-source-snapshot-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore Store packaged x64 (locked)
        run: >-
          dotnet restore EzyImageViewer.App/EzyImageViewer.App.csproj
          -p:Packaged=true -p:StoreChannel=true -p:Platform=x64 --locked-mode
          -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1903%3BNU1904
      - name: Build Store packaged x64
        run: >-
          dotnet build EzyImageViewer.App/EzyImageViewer.App.csproj
          -c Release -p:Packaged=true -p:StoreChannel=true -p:Platform=x64
          -p:FileVersion=1.0.0.0 -p:InformationalVersion=1.0.0 --no-restore
      - name: Pack unsigned Store validation package
        shell: powershell
        run: >-
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File packaging/pack-msix.ps1
          -Version 1.0.0.0 -ReleaseVersion 1.0.0
          -IdentityName "koProDev.ezyImageViewer"
          -Publisher "CN=C90B63D5-FCFF-4640-91DB-5547A8D3ECDA"
          -PublisherDisplayName "koProDev"
          -NoBuild -SkipSign -StoreChannel
      - name: Verify actual Store MSIX
        shell: powershell
        run: >-
          powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File packaging/verify-msix-release.ps1
          -MainPackage packaging/out/ezyImageViewer.msix
          -Version 1.0.0.0
          -IdentityName "koProDev.ezyImageViewer"
          -Publisher "CN=C90B63D5-FCFF-4640-91DB-5547A8D3ECDA"
          -PublisherDisplayName "koProDev"
          -RequireBuildOutputMatch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: error
          retention-days: 14
      # 서명 없는 패키지는 검증 입력일 뿐 공개 CI 산출물이 아님.
